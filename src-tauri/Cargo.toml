[package]
name = "ao-greenroom"
version = "0.1.0"
description = "AO2 3D (MMD) character rigger"
authors = ["SyntaxNyah and contributors"]
edition = "2021"

[lib]
name = "ao_greenroom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
